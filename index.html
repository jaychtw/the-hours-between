<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Hours Between · 雨停之間</title><style>*{box-sizing:border-box}body{margin:0;background:#111a1b;color:#fff1cf;font:15px Georgia,serif}main{height:100svh;display:grid;grid-template-rows:auto 1fr auto}header,footer{padding:clamp(14px,2vw,32px) 5vw;display:flex;align-items:center;gap:20px}header{justify-content:space-between}h1{font-weight:400;margin:0;font-size:clamp(23px,3.2vw,50px)}small{letter-spacing:.16em;color:#e0c79c}section{position:relative;overflow:hidden;touch-action:none;cursor:ew-resize;background:#253237}canvas{width:100%;height:100%;position:absolute}button{color:inherit;border:1px solid #817b69;border-radius:30px;padding:8px 13px;background:transparent;cursor:pointer}footer{flex-wrap:wrap}input{accent-color:#dabb86;flex:1;min-width:100px}aside{position:absolute;bottom:4%;left:5%;font-style:italic;background:#111b1cc4;padding:8px 13px;pointer-events:none}time{font-variant-numeric:tabular-nums}@media(max-width:600px){header,footer{gap:9px}small{font-size:10px}footer label{width:100%}section{max-height:75vh}}</style><main><header><div><small>臺北　·　TAIPEI</small><h1>The Hours Between</h1></div><button id="audio">Sound off</button></header><section aria-label="Taipei street. Drag sideways to move through time."><canvas></canvas><aside id="caption">Drag the afternoon forward or back.</aside></section><footer><label for="seek">雨停之間　·　Afternoon</label><button id="play">Pause</button><input aria-label="Moment in the afternoon" id="seek" type="range" min="0" max="90" step=".1" value="0"><time></time></footer></main><script>
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),stage=canvas.parentElement,bg=new Image();bg.src='taipei.webp';
let t=0,ambient=0,last=0,running=!matchMedia('(prefers-reduced-motion: reduce)').matches,drag=null,ctx,volume,hum,road,signal,muted=true;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),smooth=x=>(x=clamp(x,0,1),x*x*(3-2*x));
const art=Object.fromEntries(['bus','waiting','sharing'].map(name=>{const image=new Image();image.src=name+'.webp';return [name,image]}));
function line(d,c,w){g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.stroke(new Path2D(d))}
function paint(image,x,feet,height){if(image.naturalWidth)g.drawImage(image,x,feet-height,height*image.naturalWidth/image.naturalHeight,height)}
function figures(){// The passing bus conceals the change of pose in either direction.
paint(t<39?art.waiting:art.sharing,529,441,121)}
function bus(){const x=1350-(t-18)*48;if(x<1300&&x>-570)paint(art.bus,x,472,159)}
function foreground(wet){if(!bg.naturalWidth)return;g.save();g.clip(new Path2D('M0 0 H630 Q380 20 252 61 Q160 90 150 172 L139 182 L135 187 L133 448 L138 456 L135 688 L0 704 Z'));g.drawImage(bg,0,0,1280,720);g.fillStyle='rgba(42,58,79,'+(.27*wet)+')';g.fillRect(0,0,1280,720);g.restore()}
function frame(now){let dt=Math.min(.08,(now-last)/1000);last=now;ambient+=dt;if(running&&!drag)t=clamp(t+dt,0,90);if(t===90)running=false;
let w=stage.clientWidth,h=stage.clientHeight,d=Math.min(devicePixelRatio,1.6);if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}g.setTransform(d,0,0,d,0,0);let scale=Math.max(w/1280,h/720);g.translate((w-1280*scale)*.5+(w/h<1?75*scale:0), (h-720*scale)*.5);g.scale(scale,scale);if(bg.naturalWidth)g.drawImage(bg,0,0,1280,720);let wet=1-smooth(t/88);g.fillStyle='rgba(42,58,79,'+(.27*wet)+')';g.fillRect(0,0,1280,720);
g.save();g.translate(0,882);g.scale(1,-1);g.globalAlpha=.16;figures();g.translate(0,-62);bus();g.restore();figures();bus();
for(let i=0;i<145*wet+7;i++){let x=(i*113.91+ambient*52)%1280,y=(i*57.13+ambient*(260+i%57))%720;line('M'+x+' '+y+'l2 9','#e1e7db52',.9)}
for(let i=0;i<30*wet+4;i++){let a=(ambient*.87+i*.271)%1;g.strokeStyle='rgba(239,218,177,'+((1-a)*.35)+')';g.lineWidth=.8;g.beginPath();g.ellipse(i*173%1280,439+i*43%270,1+a*15,1+a*3,0,0,7);g.stroke()}
foreground(wet);seek.value=t;play.textContent=running?'Pause':t>=90?'Replay':'Play';document.querySelector('time').textContent='16:'+String(17+Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t)%60).padStart(2,'0');caption.hidden=t>6&&t<85;caption.textContent=t>=85?'The rain has passed. You can go back.':'Drag the afternoon forward or back.';
if(ctx){let near=Math.max(0,1-Math.abs(t-38)/9);road.gain.value=.001+.05*near;hum.frequency.value=53+near*14;signal.gain.value=.012*(1-near)*Math.pow(Math.max(0,Math.sin(ambient*5)),18);volume.gain.value=muted?0:.6}requestAnimationFrame(frame)}
seek.oninput=()=>{t=+seek.value};play.onclick=()=>{if(t>=90)t=0;running=!running};stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);drag={x:e.clientX,t}};stage.onpointermove=e=>{if(drag)t=clamp(drag.t+(e.clientX-drag.x)*90/stage.clientWidth,0,90)};stage.onpointerup=stage.onpointercancel=()=>drag=null;
audio.onclick=async()=>{if(!ctx){ctx=new AudioContext();volume=ctx.createGain();volume.gain.value=0;volume.connect(ctx.destination);hum=ctx.createOscillator();hum.type='triangle';road=ctx.createGain();hum.connect(road).connect(volume);hum.start();let chirp=ctx.createOscillator();chirp.frequency.value=780;signal=ctx.createGain();chirp.connect(signal).connect(volume);chirp.start();let noise=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),data=noise.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()-.5)*.028;let bed=ctx.createBufferSource();bed.buffer=noise;bed.loop=true;bed.connect(volume);bed.start()}await ctx.resume();muted=!muted;audio.textContent=muted?'Sound off':'Sound on'};requestAnimationFrame(frame)
</script></html>
